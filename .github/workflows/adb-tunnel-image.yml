name: ADB gateway image

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the tested image to GHCR (explicit manual develop run only)
        type: boolean
        default: false
  pull_request:
    paths:
      - tools/adb-tunnel/**
      - kuber/gitops/stf-adb-pilot/**
      - kuber/gitops/stf-gitlab/**
      - kuber/gitops/stf/**
      - kuber/gitops/root/stf-app.yaml
      - kuber/scripts/check-adb-pilot.py
      - .github/workflows/adb-tunnel-image.yml
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (develop only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: adb-gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stf-adb-gateway

jobs:
  render:
    name: Render inactive pilot without cluster access
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - run: python3 kuber/scripts/check-adb-pilot.py

  build:
    name: Container and hardened health check (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the standalone gateway
        uses: docker/build-push-action@v7
        with:
          context: tools/adb-tunnel
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: stf-adb-gateway:test
      - name: Check real container health with production security restrictions
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f stf-adb-gateway-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name stf-adb-gateway-smoke --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            stf-adb-gateway:test --config /app/config.example.json --listen 0.0.0.0:8080
          for attempt in $(seq 1 30); do
            if docker exec stf-adb-gateway-smoke node --input-type=module -e \
              'if (process.getuid() === 0) process.exit(2); const r = await fetch("http://127.0.0.1:8080/healthz"); if (r.status !== 200 || (await r.json()).status !== "ok") process.exit(1);' \
              >/dev/null 2>&1; then
              docker exec stf-adb-gateway-smoke node --input-type=module -e \
                'import fs from "node:fs"; try { fs.writeFileSync("/app/unexpected-write", "x"); process.exit(1); } catch (e) { if (e.code !== "EROFS") throw e; }'
              exit 0
            fi
            sleep 1
          done
          docker logs stf-adb-gateway-smoke
          exit 1
      - name: Save the exact tested image for an explicitly requested publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save stf-adb-gateway:test -o "$RUNNER_TEMP/gateway-$ARCH.tar"
      - name: Transfer the tested image to the gated publishing job
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: gateway-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/gateway-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Publish the tested multi-architecture index
    needs: [render, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gateway-image-*
          path: /tmp/gateway-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect the immutable deployment candidate
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "/tmp/gateway-images/gateway-$arch.tar"
            docker tag stf-adb-gateway:test "$IMAGE:$TAG-$arch"
            docker push "$IMAGE:$TAG-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
