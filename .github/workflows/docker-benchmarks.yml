name: Docker image experiments

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full SHA for the shared application source
        type: string
        required: true
      baseline_ref:
        description: Full master SHA providing the original Dockerfile
        type: string
        required: true
      candidate_ref:
        description: Full PR SHA providing the candidate Dockerfile (same as source_ref)
        type: string
        required: true
      prefetch_bundletool:
        description: Use the same verified GitHub release asset outside both timed builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'mdub1na/stf'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prefetch the official Bundletool release asset
        if: inputs.prefetch_bundletool
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/google/bundletool/releases/assets/24422831 \
            --output "$RUNNER_TEMP/bundletool.jar"
      - name: Freeze one source, recipe pair and fresh dependency snapshot
        env:
          PREFETCH_BUNDLETOOL: ${{ inputs.prefetch_bundletool }}
        run: |
          arguments=()
          files=(context environment.json recipes logger.original dependency-resolution.log)
          if [ "$PREFETCH_BUNDLETOOL" = true ]; then
            arguments+=(--bundletool-jar "$RUNNER_TEMP/bundletool.jar")
            files+=(bundletool)
          fi
          python3 docker/benchmarks/benchmark.py prepare \
            --directory "$RUNNER_TEMP/stf-benchmark" \
            --source-ref "$SOURCE_REF" --baseline-ref "$BASELINE_REF" --candidate-ref "$CANDIDATE_REF" \
            "${arguments[@]}"
          tar -czf "$RUNNER_TEMP/context.tgz" -C "$RUNNER_TEMP/stf-benchmark" "${files[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-context
          path: ${{ runner.temp }}/context.tgz
          retention-days: 1

  measure:
    needs: snapshot
    name: Same-host pair (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-context
          path: ${{ runner.temp }}
      - name: Bind this native measurement host
        run: |
          mkdir -p "$RUNNER_TEMP/stf-benchmark"
          tar -xzf "$RUNNER_TEMP/context.tgz" -C "$RUNNER_TEMP/stf-benchmark"
          python3 docker/benchmarks/benchmark.py host \
            --directory "$RUNNER_TEMP/stf-benchmark" --platform "linux/$ARCH"
      - name: Fetch the immutable amd64 AAB fixture
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p "$RUNNER_TEMP/stf-benchmark/fixtures"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/google/bundletool/24df0e8b56580cef68ba904b3a80e881f4fc641a/src/test/resources/com/android/tools/build/bundletool/testdata/bundle/install-time-permanent-modules.aab \
            -o "$RUNNER_TEMP/stf-benchmark/fixtures/install-time-permanent-modules.aab"
          printf '%s  %s\n' 83d7d10b6036da2f94ad34483a5c3d5a32891b08e4fd1a658165c55258bdaff2 \
            "$RUNNER_TEMP/stf-benchmark/fixtures/install-time-permanent-modules.aab" | sha256sum --check
      - name: Measure both variants serially on this host
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/stf-benchmark"
          mkdir -p "$directory/fixtures"
          for variant in baseline ubuntu; do
            for phase in cold warm source-1 source-2 source-3; do
              python3 docker/benchmarks/benchmark.py build --directory "$directory" \
                --variant "$variant" --phase "$phase"
              rm "$directory/$variant-$phase.oci.tar"
              if [ "$phase" = cold ]; then
                image=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$directory/$variant-cold.result.json")
                arguments=()
                if [ "$variant" = ubuntu ]; then
                  arguments+=(--allow-missing-npm)
                fi
                if [ "$ARCH" = amd64 ]; then
                  arguments+=(--aab /tmp/fixtures/install-time-permanent-modules.aab --require-aab)
                elif [ "$variant" = baseline ]; then
                  arguments+=(--baseline-arm64)
                fi
                docker run --rm --network none --platform "linux/$ARCH" \
                  --mount "type=bind,src=$PWD/docker/benchmarks/smoke.mjs,dst=/tmp/smoke.mjs,readonly" \
                  --mount "type=bind,src=$directory/fixtures,dst=/tmp/fixtures,readonly" \
                  "$image" node /tmp/smoke.mjs "${arguments[@]}" > "$directory/runtime-$variant.json"
              fi
            done
          done
      - name: Remove only this experiment's guarded builders
        if: always()
        run: |
          python3 docker/benchmarks/benchmark.py cleanup --directory "$RUNNER_TEMP/stf-benchmark"
      - name: Validate the same-host comparison
        if: always()
        run: |
          python3 docker/benchmarks/benchmark.py summarize --directory "$RUNNER_TEMP/stf-benchmark"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: same-host-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/stf-benchmark/*.json
            ${{ runner.temp }}/stf-benchmark/*.log
            ${{ runner.temp }}/stf-benchmark/recipes/
            ${{ runner.temp }}/stf-benchmark/context/package-lock.json
            ${{ runner.temp }}/stf-benchmark/logger.original
          if-no-files-found: warn
          retention-days: 30

  compare:
    if: always() && github.repository == 'mdub1na/stf'
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MEASURE_RESULT: ${{ needs.measure.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: same-host-*
          path: ${{ runner.temp }}/measurements
      - name: Verify both native pairs and compare results
        run: |
          test "$MEASURE_RESULT" = success
          python3 docker/benchmarks/benchmark.py compare --directory "$RUNNER_TEMP/measurements"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-summary
          path: ${{ runner.temp }}/measurements/comparison.json
          if-no-files-found: ignore
          retention-days: 30
