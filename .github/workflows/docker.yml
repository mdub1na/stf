name: Docker

on:
  workflow_dispatch:
    inputs:
      component:
        description: Image family to build
        type: choice
        options: [farm, adb-gateway]
        default: farm
      publish_gateway:
        description: Publish the tested ADB gateway image (develop only)
        type: boolean
        default: false
  pull_request:
    paths-ignore: ['**.md', 'doc/**', 'kuber/**']
  push:
    branches: [master, develop]
    paths-ignore: ['**.md', 'doc/**', 'kuber/**']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    if: github.event_name != 'workflow_dispatch' || inputs.component != 'adb-gateway'
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ github.sha }}
      push: ${{ github.event_name != 'pull_request' }}

  debian:
    name: Debian image
    if: github.event_name == 'pull_request' && inputs.component != 'adb-gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-debian-x86_64
          platforms: linux/amd64

  gateway:
    name: Standalone ADB gateway
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'adb-gateway'
    uses: ./.github/workflows/adb-tunnel-image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ inputs.publish_gateway }}
