apiVersion: v1
kind: ResourceQuota
metadata:
  name: stf-ci-jobs
  namespace: stf-ci-jobs
spec:
  hard:
    pods: "4"
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 9Gi
    requests.ephemeral-storage: 6Gi
    limits.ephemeral-storage: 18Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: stf-ci-job-defaults
  namespace: stf-ci-jobs
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 4Gi
      max:
        cpu: "2"
        memory: 3Gi
        ephemeral-storage: 6Gi
