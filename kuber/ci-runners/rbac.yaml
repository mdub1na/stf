apiVersion: v1
kind: ServiceAccount
metadata:
  name: stf-ci-manager
  namespace: stf-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stf-ci-job
  namespace: stf-ci-jobs
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stf-ci-manager
  namespace: stf-ci-jobs
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/attach, pods/exec]
    verbs: [create, delete, get, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stf-ci-manager
  namespace: stf-ci-jobs
subjects:
  - kind: ServiceAccount
    name: stf-ci-manager
    namespace: stf-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stf-ci-manager
