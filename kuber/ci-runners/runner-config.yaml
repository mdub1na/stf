apiVersion: v1
kind: ConfigMap
metadata:
  name: stf-ci-runner-template
  namespace: stf-ci
data:
  config.global.toml: |
    concurrent = 3
    check_interval = 3
    shutdown_timeout = 90
  config.template.toml: |
    [[runners]]
      name = "stf-farm-kubernetes"
      url = "https://gitlab.finservice.tech"
      executor = "kubernetes"
      limit = 3
      request_concurrency = 3
      environment = ["HOME=/tmp", "FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY=false", "FF_USE_POD_ACTIVE_DEADLINE_SECONDS=true"]
      [runners.kubernetes]
        namespace = "stf-ci-jobs"
        service_account = "stf-ci-job"
        automount_service_account_token = false
        bearer_token_overwrite_allowed = false
        privileged = false
        allow_privilege_escalation = false
        cap_drop = ["ALL"]
        image = "registry.finservice.tech/gfs/platform/quality/farm-connection-smoke/ci-worker:prototype"
        allowed_images = ["registry.finservice.tech/gfs/platform/quality/farm-connection-smoke/ci-worker@sha256:*"]
        allowed_services = ["invalid.local/services-disabled:*"]
        pull_policy = "always"
        allowed_pull_policies = ["always"]
        cpu_request = "500m"
        cpu_limit = "1"
        memory_request = "1Gi"
        memory_limit = "2Gi"
        ephemeral_storage_request = "1Gi"
        ephemeral_storage_limit = "4Gi"
        helper_cpu_request = "100m"
        helper_cpu_limit = "500m"
        helper_memory_request = "128Mi"
        helper_memory_limit = "256Mi"
        helper_ephemeral_storage_request = "256Mi"
        helper_ephemeral_storage_limit = "1Gi"
        poll_timeout = 300
        cleanup_grace_period_seconds = 180
        pod_termination_grace_period_seconds = 180
        enable_service_links = false
        [runners.kubernetes.pod_labels]
          "app.kubernetes.io/name" = "stf-ci-job"
          "stf-coordinator-access" = "allowed"
        [runners.kubernetes.pod_security_context]
          run_as_non_root = true
          run_as_user = 1000
          run_as_group = 1000
          fs_group = 1000
