apiVersion: apps/v1
kind: Deployment
metadata:
  name: stf-ci-manager
  namespace: stf-ci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stf-ci-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stf-ci-manager
    spec:
      serviceAccountName: stf-ci-manager
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: register
          image: gitlab/gitlab-runner:alpine-v19.5.0@sha256:b7dead3b57cd9e5e5d6aedc6c0736c43972af9a24aa19875c2802bc8afcd3978
          command: [/bin/sh, -ec]
          args:
            - |
              cp /template/config.global.toml /runner/config.toml
              gitlab-runner register --non-interactive                 --url https://gitlab.finservice.tech                 --token "$RUNNER_TOKEN"                 --executor kubernetes                 --template-config /template/config.template.toml                 --config /runner/config.toml > /runner/registration.log 2>&1
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stf-ci-runner-auth
                  key: runner-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: template, mountPath: /template, readOnly: true}
            - {name: config, mountPath: /runner}
            - {name: home, mountPath: /home/gitlab-runner}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: runner
          image: gitlab/gitlab-runner:alpine-v19.5.0@sha256:b7dead3b57cd9e5e5d6aedc6c0736c43972af9a24aa19875c2802bc8afcd3978
          command: [gitlab-runner, run, --config, /runner/config.toml, --working-directory, /home/gitlab-runner]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /runner}
            - {name: home, mountPath: /home/gitlab-runner}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: template
          configMap:
            name: stf-ci-runner-template
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
