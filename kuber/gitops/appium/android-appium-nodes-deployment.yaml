apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-appium-node-1
  labels:
    app.kubernetes.io/name: android-appium-node-1
spec:
  replicas: 4
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: android-appium-node-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-appium-node-1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: stf.role
                    operator: In
                    values:
                      - android
      containers:
        - name: appium
          image: appium/appium:v3.8.0-p1@sha256:aa0af4543b763c69da31388251bbea2347ae8e01f8d0516cf6b35c35a2c9fe3e
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /status
              port: appium
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: appium
            periodSeconds: 10
          command:
            - appium
          args:
            - --port
            - "4733"
            - --base-path
            - /
            - --use-drivers
            - uiautomator2
            - --allow-insecure
            - uiautomator2:chromedriver_autodownload
          env:
            - name: ANDROID_ADB_SERVER_HOST
              value: adbd.stf.svc.cluster.local
            - name: ANDROID_ADB_SERVER_PORT
              value: "5037"
            - name: ADB_SERVER_SOCKET
              value: tcp:adbd.stf.svc.cluster.local:5037
          ports:
            - name: appium
              containerPort: 4733
        - name: adb-proxy
          image: alpine/socat:1.8.0.3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 64Mi
          args:
            - tcp-listen:5037,fork,reuseaddr
            - tcp:adbd.stf.svc.cluster.local:5037
          ports:
            - name: adb
              containerPort: 5037
        - name: selenium-node-relay
          image: selenium/node-base:4.51.0-20261010@sha256:e582019bb0748d7b551ebd8d0aaeb0197531510683ccdf172a4b45087830dc9d
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command:
            - /bin/sh
            - -c
            - >-
              java -jar /opt/selenium/selenium-server.jar node
              --publish-events tcp://appium-grid-event-bus:4442
              --subscribe-events tcp://appium-grid-event-bus:4443
              --config /opt/selenium/config/node-android.toml
          env:
            - name: SE_EVENT_BUS_HOST
              value: appium-grid-event-bus
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
          volumeMounts:
            - name: node-config
              mountPath: /opt/selenium/config
      volumes:
        - name: node-config
          configMap:
            name: android-appium-node-config
---
