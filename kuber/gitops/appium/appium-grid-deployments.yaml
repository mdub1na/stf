apiVersion: apps/v1
kind: Deployment
metadata:
  name: appium-grid-event-bus
  labels:
    app.kubernetes.io/name: appium-grid-event-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appium-grid-event-bus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appium-grid-event-bus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: stf.role
                    operator: In
                    values:
                      - storage
      containers:
        - name: event-bus
          image: selenium/event-bus:4.51.0-20261010@sha256:d522966c38946625bae1e03b24800d470f77372187b3a1045f8ed3a153ed052b
          imagePullPolicy: IfNotPresent
          ports:
            - name: publish
              containerPort: 4442
            - name: subscribe
              containerPort: 4443
---
