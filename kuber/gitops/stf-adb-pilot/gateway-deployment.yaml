apiVersion: apps/v1
kind: Deployment
metadata:
  name: stf-adb-gateway
  labels:
    app.kubernetes.io/name: stf-adb-gateway
spec:
  replicas: 1
  # Tickets and attached sessions live in this process. Avoid two concurrent replicas.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stf-adb-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stf-adb-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: stf-adb-gateway:unpublished-do-not-apply
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stf-adb/gateway.json
            - --listen
            - 0.0.0.0:8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/stf-adb
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stf-adb-gateway
