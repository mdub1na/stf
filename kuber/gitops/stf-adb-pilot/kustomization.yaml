apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INACTIVE: the STF Argo Application still uses ../stf-gitlab.
# Replace the marker with a verified GHCR digest before proposing activation.
namespace: stf

resources:
  - ../stf-gitlab
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-ingress.yaml

configMapGenerator:
  - name: stf-adb-gateway
    files:
      - gateway.json

images:
  - name: stf-adb-gateway
    newName: ghcr.io/mdub1na/stf-adb-gateway
    newTag: unpublished-do-not-apply
