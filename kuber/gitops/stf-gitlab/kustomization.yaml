apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LDAP remains available in ../stf for an explicit GitOps rollback.
resources:
  - ../stf

patches:
  - path: gitlab-config-patch.yaml
  - path: auth-image-patch.yaml
  - path: app-image-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-auth
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: [stf, auth-oauth2, --port, "3000"]
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: stf-env
          - secretRef:
              name: stf-session
          - secretRef:
              name: stf-gitlab-oauth
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-(app|auth)
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/stf~1config-revision
        value: stf-gitlab-oauth-v1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-(triproxy-app|triproxy-dev|storage-temp|storage-plugin-apk|storage-plugin-image|processor|reaper|api|websocket|api-groups-engine|auth|app|provider|provider-2)
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: stf-farm-registry-pull

images:
  - name: ghcr.io/mdub1na/stf
    newName: registry.finservice.tech/gfs/platform/quality/farm-connection-smoke/runtime
    digest: sha256:4d4a19bf3f5f52345deb1d82571f0a56423363d33c8ebd6f4bf6dac11a361ddd
