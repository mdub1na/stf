apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stf

resources:
  - namespace.yaml
  - stf-configmap.yaml
  - stf-storage-temp-pvc.yaml
  - stf-core-services.yaml
  - stf-core-deployments.yaml
  - stf-android-services.yaml
  - stf-android-deployments.yaml
  - stf-dynamic-proxy.yaml
  - stf-issuer.yaml
  - stf-certificate.yaml
  - stf-ingress.yaml

images:
  - name: mdub1na/stf
    newName: ghcr.io/mdub1na/stf
    digest: sha256:9da0a528f91c5ced4594ee1706392042808819276675311827e516b4971c4e81

patches:
  - path: stf-runtime-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-(triproxy-app|triproxy-dev|storage-temp|storage-plugin-apk|storage-plugin-image|processor|reaper|api|websocket|api-groups-engine|auth|app|provider|provider-2)
  - path: stf-session-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-(app|auth|api|websocket)
  - path: stf-http-probes-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-(app|auth|api|websocket|storage-temp|storage-plugin-apk|storage-plugin-image)
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-auth
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: stf-ldap-bind
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stf-provider(-2)?
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
