apiVersion: apps/v1
kind: Deployment
metadata:
  name: stf-reaper
  labels:
    app.kubernetes.io/name: stf-reaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stf-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stf-reaper
    spec:
      containers:
        - name: stf-reaper
          image: mdub1na/stf:kuber-amd64-4f59199e
          imagePullPolicy: IfNotPresent
          command:
            - stf
            - reaper
