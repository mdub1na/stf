apiVersion: apps/v1
kind: Deployment
metadata:
  name: stf-triproxy-app
  labels:
    app.kubernetes.io/name: stf-triproxy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stf-triproxy-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stf-triproxy-app
    spec:
      containers:
        - name: stf-triproxy-app
          image: mdub1na/stf:kuber-amd64-4f59199e
          imagePullPolicy: IfNotPresent
          command:
            - stf
            - triproxy
            - app001
            - --bind-pub
            - tcp://*:7150
            - --bind-dealer
            - tcp://*:7160
            - --bind-pull
            - tcp://*:7170
          envFrom:
            - configMapRef:
                name: stf-env
          ports:
            - name: pub
              containerPort: 7150
            - name: dealer
              containerPort: 7160
            - name: pull
              containerPort: 7170
---
apiVersion: apps/v1
kind: Deployment
metadata:
