---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stf-storage-temp
  labels:
    app.kubernetes.io/name: stf-storage-temp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stf-storage-temp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stf-storage-temp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: stf.role
                    operator: In
                    values:
                      - storage
      containers:
        - name: stf-storage-temp
          image: mdub1na/stf:kuber-amd64-4f59199e
          imagePullPolicy: IfNotPresent
          command:
            - stf
            - storage-temp
            - --port
            - "3000"
            - --save-dir
            - /tmp
          envFrom:
            - configMapRef:
                name: stf-env
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: storage-temp-data
              mountPath: /tmp
      volumes:
        - name: storage-temp-data
          persistentVolumeClaim:
            claimName: stf-storage-temp-pvc
---
