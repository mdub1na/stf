apiVersion: v1
kind: Service
metadata:
  name: ios-provider
  namespace: stf-ios-prototype
spec:
  selector: {app: stf-ios-prototype}
  ports:
    - {name: screen, port: 17440, targetPort: screen}
---
apiVersion: v1
kind: Service
metadata:
  name: stf-ios-provider
  namespace: stf
spec:
  type: ExternalName
  externalName: ios-provider.stf-ios-prototype.svc.cluster.local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ios-stf-screen
  namespace: stf-ios-prototype
spec:
  podSelector:
    matchLabels: {app: stf-ios-prototype}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: stf}
          podSelector:
            matchLabels: {app.kubernetes.io/name: stf-dynamic-proxy}
      ports:
        - {protocol: TCP, port: 17440}
