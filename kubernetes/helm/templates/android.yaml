{{- $r := . -}}
{{- range .Values.android.providers -}}
{{- $component := printf "android-%s" .name -}}
{{- $name := include "stf.name" (dict "root" $r "component" $component) -}}
{{- $adb := include "stf.name" (dict "root" $r "component" (printf "adb-%s" .name)) -}}
{{- $external := default dict .externalAdb -}}
{{- $pool := include "stf.androidPool" (dict "root" $r "provider" .) | fromJson -}}
{{- $appium := and $r.Values.appium.enabled .appium -}}
{{- $min := int (default 7400 .minPort) -}}
{{- $capacity := int (default 8 .capacity) -}}
{{- $max := int (default (sub (add $min (mul 4 $capacity)) 1) .maxPort) -}}
{{- $capacity = div (add (sub $max $min) 1) 4 | int -}}
{{ printf "\n---\n" }}apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate, rollingUpdate: null}
  selector:
    matchLabels: {{ include "stf.selector" (dict "root" $r "component" $component) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "stf.podLabels" (dict "root" $r "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (dict "provider" . "origin" $r.Values.publicOrigin "migration" (include "stf.migration" $r)) | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- if $r.Values.migration.enabled }}
      serviceAccountName: {{ include "stf.name" (dict "root" $r "component" "wait-migration") }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if $r.Values.migration.enabled }}
      initContainers: {{ include "stf.waitMigration" $r | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ default "provider" .containerName }}
          image: {{ include "stf.image" $r.Values.image | quote }}
          imagePullPolicy: {{ $r.Values.image.pullPolicy }}
          command: [stf, provider]
          args:
            {{- range .serials }}
            - {{ . | quote }}
            {{- end }}
            - --name={{ $name }}
            - --adb-host={{ $pool.host }}
            - --adb-port={{ $pool.port }}
            - --public-ip={{ regexReplaceAll ":[0-9]+$" (urlParse $r.Values.publicOrigin).host "" }}
            - --min-port={{ $min }}
            - --max-port={{ $max }}
            - --screen-ws-url-pattern={{ regexReplaceAll "^http" $r.Values.publicOrigin "ws" }}/d/{{ $name }}/<%= publicPort %>/
            - {{ printf "--storage-url=%s" (default (printf "http://%s:%v/" (include "stf.name" (dict "root" $r "component" "proxy")) $r.Values.proxy.service.port) .storageUrl) | quote }}
            - --connect-push=tcp://{{ include "stf.name" (dict "root" $r "component" "triproxy-dev") }}:{{ $r.Values.messaging.dev.pull }}
            - --connect-sub=tcp://{{ include "stf.name" (dict "root" $r "component" "triproxy-dev") }}:{{ $r.Values.messaging.dev.pub }}
            {{- range .extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env: {{ include "stf.env" $r | nindent 12 }}
          resources: {{ toYaml (default $r.Values.core.resources .resources) | nindent 12 }}
      {{- if $r.Values.migration.enabled }}
      volumes: {{ include "stf.migrationVolumes" $r | nindent 8 }}
      {{- end }}
{{- if dig "create" true (default dict .service) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector: {{ include "stf.selector" (dict "root" $r "component" $component) | nindent 4 }}
  ports:
    {{- range $i := until (add (sub $max $min) 1 | int) }}
    - {name: p{{ add $min $i }}, port: {{ add $min $i }}, targetPort: {{ add $min $i }}}
    {{- end }}
{{- end }}
{{- if not $external.host }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $adb }}
spec:
  replicas: 1
  strategy: {type: Recreate, rollingUpdate: null}
  selector:
    matchLabels: {{ include "stf.selector" (dict "root" $r "component" (printf "adb-%s" .name)) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "stf.podLabels" (dict "root" $r "component" (printf "adb-%s" .name)) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .nodeSelector | nindent 8 }}
      {{- with .tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: adb
          image: {{ $r.Values.android.adbImage | quote }}
          securityContext: {privileged: true}
          ports: [{name: adb, containerPort: 5037}]
          startupProbe: {tcpSocket: {port: adb}, periodSeconds: 2, failureThreshold: 90}
          readinessProbe: {tcpSocket: {port: adb}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: adb}, periodSeconds: 20, failureThreshold: 6}
          resources: {{ toYaml (default $r.Values.core.resources .resources) | nindent 12 }}
          volumeMounts:
            - {name: usb, mountPath: /dev/bus/usb}
            {{- with .adbKeysClaim }}
            - {name: keys, mountPath: /root/.android}
            {{- end }}
      volumes:
        - name: usb
          hostPath: {path: /dev/bus/usb, type: Directory}
        {{- with .adbKeysClaim }}
        - name: keys
          persistentVolumeClaim: {claimName: {{ . | quote }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $adb }}
spec:
  selector: {{ include "stf.selector" (dict "root" $r "component" (printf "adb-%s" .name)) | nindent 4 }}
  {{- if $appium }}
  ports:
    - {name: adb, port: 5037, targetPort: adb}
    {{- range $pool.systemPorts }}
    - {name: appium-{{ . }}, port: {{ . }}, targetPort: {{ . }}}
    {{- end }}
  {{- else }}
  ports: [{name: adb, port: 5037, targetPort: adb}]
  {{- end }}
{{- end }}
{{- if $appium }}
{{- $identity := dict "root" $r "component" (printf "appium-android-%s" .name) -}}
{{- $appiumName := include "stf.name" $identity -}}
{{- $stereotype := dict "platformName" "Android" "appium:automationName" "UiAutomator2" "appium:remoteAdbHost" $pool.host "appium:adbPort" $pool.port -}}
{{- $relayConfig := include "stf.appiumRelayConfig" (dict "stereotype" $stereotype "port" 4723) -}}
{{- $probe := list "node" "-e" "fetch('http://127.0.0.1:4723/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" -}}
{{- $nodeSelector := deepCopy (default dict $appium.nodeSelector) -}}
{{- with $r.Values.appium.nodeArchitecture -}}
  {{- $_ := set $nodeSelector "kubernetes.io/arch" . -}}
{{- end -}}
{{ printf "\n---\n" }}apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $appiumName }}
  labels: {{ include "stf.labels" $r | nindent 4 }}
data:
  node.toml: |
    {{- $relayConfig | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appiumName }}
  labels: {{ include "stf.labels" $r | nindent 4 }}
spec:
  replicas: {{ default 1 $appium.replicas }}
  selector:
    matchLabels: {{ include "stf.selector" $identity | nindent 6 }}
  template:
    metadata:
      labels: {{ merge (dict "stf-appium-relay" "true") (include "stf.podLabels" $identity | fromYaml) | toYaml | nindent 8 }}
      annotations:
        checksum/relay-config: {{ $relayConfig | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- with $nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $appium.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: appium
          image: {{ include "stf.image" $r.Values.appium.image | quote }}
          imagePullPolicy: {{ $r.Values.appium.image.pullPolicy }}
          command: [appium]
          args:
            - --address=127.0.0.1
            - --port=4723
            - --use-drivers=uiautomator2
            - '--default-capabilities={"appium:suppressKillServer":true,"appium:skipLogcatCapture":true}'
          env:
            - {name: ANDROID_ADB_SERVER_HOST, value: {{ $pool.host | quote }}}
            - {name: ANDROID_ADB_SERVER_PORT, value: {{ $pool.port | quote }}}
            - {name: ADB_SERVER_SOCKET, value: {{ printf "tcp:%s:%v" $pool.host $pool.port | quote }}}
          startupProbe: {exec: {command: {{ $probe | toJson }}}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {exec: {command: {{ $probe | toJson }}}, periodSeconds: 5}
          resources: {{ toYaml $r.Values.appium.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        {{- include "stf.appiumRelay" (dict "root" $r) | nindent 8 }}
      volumes:
        - name: appium-relay-config
          configMap: {name: {{ $appiumName }}}
{{- end }}
{{- end }}
