{{- if not (regexMatch "^https?://[^/?#@]+$" .Values.publicOrigin) }}{{ fail "publicOrigin must be an HTTP(S) origin without a path, credentials or trailing slash" }}{{ end -}}
{{- $names := dict -}}
{{- $udids := dict -}}
{{- $nodes := dict -}}
{{- $externalPools := dict -}}
{{- $bundledGrid := .Values.appium.enabled -}}
{{- $hasAppiumDevice := false -}}
{{- $appiumPools := dict -}}
{{- if $bundledGrid -}}
{{- if not .Values.coordinator.enabled }}{{ fail "appium.enabled requires coordinator.enabled" }}{{ end -}}
{{- if .Values.coordinator.appiumGridUrl }}{{ fail "appium.enabled and coordinator.appiumGridUrl are mutually exclusive" }}{{ end -}}
{{- $image := .Values.appium.image -}}
{{- if or (not $image.repository) (not (or $image.tag $image.digest)) }}{{ fail "appium.image requires a repository and tag or digest; build docker/appium/Dockerfile" }}{{ end -}}
{{- end -}}
{{- range .Values.android.providers -}}
{{- if hasKey $names .name }}{{ fail "provider/device names must be unique" }}{{ end -}}
{{- $_ := set $names .name true -}}
{{- $capacity := int (default 8 .capacity) -}}
{{- $port := int (default 7400 .minPort) -}}
{{- $end := int (default (sub (add $port (mul 4 $capacity)) 1) .maxPort) -}}
{{- if or (lt $capacity 1) (gt $capacity 128) (lt $port 1024) (gt $end 65535) (lt (sub $end $port) 3) (gt (sub $end $port) 511) }}{{ fail "Android port pool is invalid" }}{{ end -}}
{{- $external := default dict .externalAdb -}}
{{- if $external.host -}}
{{- $pool := printf "%s:%v" $external.host (default 5037 $external.port) -}}
{{- $serials := default list .serials -}}
{{- if hasKey $externalPools $pool -}}
{{- $other := get $externalPools $pool -}}
{{- if or (not $other) (not $serials) }}{{ fail "providers sharing externalAdb require explicit disjoint serials" }}{{ end -}}
{{- range $serials -}}{{- if has . $other }}{{ fail "providers sharing externalAdb cannot select the same serial" }}{{ end -}}{{- end -}}
{{- $_ := set $externalPools $pool (concat $other $serials) -}}
{{- else -}}{{- $_ := set $externalPools $pool $serials -}}{{- end -}}
{{- else -}}
{{- if not .nodeSelector }}{{ fail "a USB Android provider requires nodeSelector" }}{{ end -}}
{{- $node := index .nodeSelector "kubernetes.io/hostname" -}}
{{- if not $node }}{{ fail "a USB Android provider requires an explicit kubernetes.io/hostname selector" }}{{ end -}}
{{- if hasKey $nodes $node }}{{ fail "configure one USB ADB server per node; use externalAdb and disjoint serials to share it" }}{{ end -}}
{{- $_ := set $nodes $node true -}}
{{- end -}}
{{- if and $bundledGrid .appium -}}
{{- $hasAppiumDevice = true -}}
{{- if lt (len .appium.systemPorts) (int (default 1 .appium.replicas)) }}{{ fail "Android Appium requires at least one systemPort per replica" }}{{ end -}}
{{- $arch := index (default dict .appium.nodeSelector) "kubernetes.io/arch" -}}
{{- if and $arch $.Values.appium.nodeArchitecture (ne $arch $.Values.appium.nodeArchitecture) }}{{ fail "Android Appium nodeSelector conflicts with appium.nodeArchitecture" }}{{ end -}}
{{- $pool := include "stf.androidPool" (dict "root" $ "provider" .) | fromJson -}}
{{- $_ := set $appiumPools $pool.provider $pool -}}
{{- end -}}
{{- end -}}
{{- range .Values.ios.devices -}}
{{- if hasKey $names .name }}{{ fail "provider/device names must be unique" }}{{ end -}}
{{- $_ := set $names .name true -}}
{{- $id := lower .udid -}}
{{- if hasKey $udids $id }}{{ fail "iOS UDIDs must be unique" }}{{ end -}}
{{- $_ := set $udids $id true -}}
{{- if not .nodeSelector }}{{ fail "an iPhone requires nodeSelector for its USB host" }}{{ end -}}
{{- if and $bundledGrid .appium -}}
{{- $hasAppiumDevice = true -}}
{{- $arch := index .nodeSelector "kubernetes.io/arch" -}}
{{- if and $arch $.Values.appium.nodeArchitecture (ne $arch $.Values.appium.nodeArchitecture) }}{{ fail "iOS Appium nodeSelector conflicts with appium.nodeArchitecture" }}{{ end -}}
{{- range .extraContainers -}}
{{- if and (kindIs "map" .) (has .name (list "appium" "relay")) }}{{ fail "bundled iOS Appium requires removing the old appium or relay extraContainer" }}{{ end -}}
{{- end -}}
{{- range .extraVolumes -}}
{{- if and (kindIs "map" .) (eq (default "" .name) "appium-relay-config") }}{{ fail "bundled iOS Appium reserves the appium-relay-config volume name" }}{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $bundledGrid (not $hasAppiumDevice) }}{{ fail "appium.enabled requires Appium configuration for at least one provider or iPhone" }}{{ end -}}
{{- if .Values.ios.devices -}}
{{- if or (not .Values.ios.image.repository) (and (not .Values.ios.image.tag) (not .Values.ios.image.digest)) }}{{ fail "ios.image requires a real repository and tag or digest; build docker/ios/Dockerfile" }}{{ end -}}
{{- end -}}
{{- if .Values.coordinator.enabled -}}
{{- $c := .Values.coordinator -}}
{{- if and $c.image (or (not $c.image.repository) (not (or $c.image.tag $c.image.digest))) }}{{ fail "coordinator.image requires a repository and tag or digest" }}{{ end -}}
{{- if and $c.appiumGridUrl .Values.android.providers (not $c.adbPools) }}{{ fail "coordinator.adbPools must be explicit when Appium Grid is enabled with Android providers" }}{{ end -}}
{{- $providers := dict -}}
{{- $systemPorts := dict -}}
{{- $adbPorts := dict -}}
{{- $pools := include "stf.coordinatorAdbPools" . | fromJsonArray -}}
{{- range $pools -}}
{{- $_ := set $adbPorts (printf "%s:%v" .host .port) true -}}
{{- end -}}
{{- range $pools -}}
{{- if hasKey $providers .provider }}{{ fail "coordinator.adbPools provider names must be unique" }}{{ end -}}
{{- $_ := set $providers .provider . -}}
{{- $host := .host -}}
{{- range .systemPorts -}}
{{- $key := printf "%s:%v" $host . -}}
{{- if hasKey $systemPorts $key }}{{ fail "coordinator.adbPools systemPorts cannot overlap on the same host" }}{{ end -}}
{{- if hasKey $adbPorts $key }}{{ fail "coordinator.adbPools systemPorts cannot use an ADB control port" }}{{ end -}}
{{- $_ := set $systemPorts $key true -}}
{{- end -}}
{{- end -}}
{{- range $provider, $expected := $appiumPools -}}
{{- $configured := get $providers $provider -}}
{{- if or (not $configured) (ne $configured.host $expected.host) (ne $configured.port $expected.port) (not (deepEqual (sortAlpha $configured.systemPorts) (sortAlpha $expected.systemPorts))) }}{{ fail (printf "coordinator.adbPools must match the bundled Appium ADB pool for %s" $provider) }}{{ end -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.database.bundled) (not .Values.database.external.host) }}{{ fail "database.external.host is required" }}{{ end -}}

{{- if and .Values.database.bundled .Values.database.external.existingSecret }}{{ fail "database.external.existingSecret requires database.bundled=false" }}{{ end -}}

{{- range $bus := list .Values.messaging.app .Values.messaging.dev -}}
{{- if or (eq (int $bus.pub) (int $bus.dealer)) (eq (int $bus.pub) (int $bus.pull)) (eq (int $bus.dealer) (int $bus.pull)) }}{{ fail "messaging ports must be distinct within each triproxy" }}{{ end -}}
{{- end -}}
{{- $routes := dict -}}
{{- range .Values.proxy.extraScreenRoutes -}}
{{- if hasKey $routes .path }}{{ fail "extra screen paths must be unique" }}{{ end -}}
{{- $_ := set $routes .path true -}}
{{- end -}}
{{- if $bundledGrid -}}
{{- range $component, $labels := .Values.selectorOverrides -}}
{{- if hasKey $labels "stf-appium-relay" }}{{ fail (printf "selectorOverrides.%s cannot set the reserved stf-appium-relay label" $component) }}{{ end -}}
{{- end -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- range $component, $labels := .Values.selectorOverrides -}}
{{- range $key, $expected := dict "app.kubernetes.io/instance" $.Release.Name "app.kubernetes.io/component" $component -}}
{{- if and (hasKey $labels $key) (ne (get $labels $key) $expected) }}{{ fail (printf "selectorOverrides.%s must not override %s: %s while networkPolicy is enabled" $component $key $expected) }}{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}
